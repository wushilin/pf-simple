name: Docker images

# A v* tag publishes to Docker Hub and GHCR. Run it by hand with a tag to
# publish an image for a release made before this workflow existed; the
# source is that tag, the Dockerfile comes from the branch the run is on.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, like v0.7.0
        required: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: wushilin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/wushilin/pf-simple
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
