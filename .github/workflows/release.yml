name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          name="pf-simple-${GOOS}-${GOARCH}"
          client="pf-client-${GOOS}-${GOARCH}"
          quic="pf-client-quic-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags="-s -w" -o "dist/${name}.exe" .
            go build -trimpath -ldflags="-s -w" -o "dist/${client}.exe" ./cmd/pf-client
            go build -trimpath -ldflags="-s -w" -o "dist/${quic}.exe" ./cmd/pf-client-quic
            (cd dist && zip -q "${name}.zip" "${name}.exe" "${client}.exe" "${quic}.exe")
          else
            go build -trimpath -ldflags="-s -w" -o "dist/${name}" .
            go build -trimpath -ldflags="-s -w" -o "dist/${client}" ./cmd/pf-client
            go build -trimpath -ldflags="-s -w" -o "dist/${quic}" ./cmd/pf-client-quic
            tar -C dist -czf "dist/${name}.tar.gz" "${name}" "${client}" "${quic}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pf-simple-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/pf-simple-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/pf-simple-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pf-simple-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip

  # The Go SDK (github.com/wushilin/pf-simple/pfrelay) is published by the
  # tag itself: no registry, no login. Asking the Go module proxy for the
  # new version makes it available at once, and lists it on pkg.go.dev.
  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://proxy.golang.org/github.com/wushilin/pf-simple/@v/${GITHUB_REF_NAME}.info"
