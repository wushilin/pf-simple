name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (linux, splice path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 30m ./...

  sdk:
    name: SDK conformance (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: python
            setup: python3 -I -m unittest discover -s sdk/python/tests
            driver: python3 -I sdk/python/driver.py
          - sdk: rust
            setup: cargo test --manifest-path sdk/rust/Cargo.toml && cargo build --release --manifest-path sdk/rust/Cargo.toml
            driver: sdk/rust/target/release/driver
          - sdk: java
            setup: sdk/java/build.sh
            driver: sdk/java/driver.sh
          - sdk: rust-quic
            setup: cargo test --manifest-path sdk/rust-quic/Cargo.toml && cargo build --release --manifest-path sdk/rust-quic/Cargo.toml
            driver: sdk/rust-quic/target/release/driver
          - sdk: java-quic
            setup: sdk/java-quic/build.sh
            driver: sdk/java-quic/driver.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - if: matrix.sdk == 'java' || matrix.sdk == 'java-quic'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and unit-test the SDK
        run: ${{ matrix.setup }}
      - name: Conformance suite
        env:
          PF_CONFORMANCE_DRIVER: ${{ matrix.driver }}
          PF_CONFORMANCE_SLOW: "1"
        run: go test -count=1 -run TestConformance -v .

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/pf-simple .
          go build -trimpath -ldflags="-s -w" -o /tmp/pf-client ./cmd/pf-client
          go build -trimpath -ldflags="-s -w" -o /tmp/pf-client-quic ./cmd/pf-client-quic
