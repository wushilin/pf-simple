<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" role="img" aria-labelledby="t d">
<title id="t">pf-simple relay hub</title>
<desc id="d">Machine A runs pf-client connect and machine B runs pf-client serve. Both open outbound HTTPS WebSocket connections to a pf-simple server, which joins them by a shared word. Three uses are shown: SSH through a ProxyCommand, sending files with tar, and a chat between two terminals.</desc>
<defs>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.h{font-size:17px;font-weight:600} .s{font-size:13px;fill:#59636e} .k{font-size:13px}
.c{fill:#f6f8fa;stroke:#d0d7de} .p{fill:#59636e}
</style>
</defs>
<rect x="0.5" y="0.5" width="999" height="667" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="500.0" y="40" text-anchor="middle" style="font-size:20px;font-weight:600">Two machines that cannot reach each other meet at a pf-simple server</text>

<rect x="30" y="64" width="300" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="180" y="92" text-anchor="middle" class="h" style="fill:#0969da">Machine A</text>
<text x="180" y="114" text-anchor="middle" class="m">pf-client connect</text>
<text x="180" y="142" text-anchor="middle" class="k">your app uses a local port, or stdio</text>
<text x="180" y="164" text-anchor="middle" class="k">knows: the word</text>
<rect x="670" y="64" width="300" height="140" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="820" y="92" text-anchor="middle" class="h" style="fill:#1a7f37">Machine B</text>
<text x="820" y="114" text-anchor="middle" class="m">pf-client serve</text>
<text x="820" y="142" text-anchor="middle" class="k">reaches the target, or offers stdio</text>
<text x="820" y="164" text-anchor="middle" class="k">knows: the word + a serve token</text>
<rect x="400" y="64" width="200" height="140" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="500" y="92" text-anchor="middle" class="h" style="fill:#8250df">pf-simple server</text>
<text x="500" y="114" text-anchor="middle" class="k">relay hub</text>
<text x="500" y="146" text-anchor="middle" class="k">joins the two sides</text>
<text x="500" y="168" text-anchor="middle" class="k">that give the same word</text>
<line x1="334" y1="134" x2="396" y2="134" stroke="#0969da" stroke-width="2.5" marker-end="url(#aa)"/>
<line x1="666" y1="134" x2="604" y2="134" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="500.0" y="232" text-anchor="middle" class="s">Both sides dial out over HTTPS (WebSocket). Neither machine opens an inbound port.</text>
<text x="500.0" y="252" text-anchor="middle" class="s">A broken link closes the connection; nothing is resumed.</text>
<text x="30" y="292" class="k" style="font-weight:600;fill:#0969da">Run on machine A</text>
<text x="970" y="292" text-anchor="end" class="k" style="font-weight:600;fill:#1a7f37">Run on machine B</text>
<rect x="30" y="304" width="360" height="104" rx="8" class="c"/>
<rect x="610" y="304" width="360" height="104" rx="8" class="c"/>
<text x="500" y="352" text-anchor="middle" class="h">SSH</text>
<text x="500" y="374" text-anchor="middle" class="s">no local port</text>
<path d="M398 356.0H420M580 356.0H602" stroke="#d0d7de" stroke-width="1.5"/>
<text x="46" y="341.0" class="m" xml:space="preserve">ssh -o ProxyCommand=\</text>
<text x="46" y="361.0" class="m" xml:space="preserve">  &quot;pf-client connect … stdio&quot; \</text>
<text x="46" y="381.0" class="m" xml:space="preserve">  user@office</text>
<text x="626" y="351.0" class="m" xml:space="preserve">pf-client serve … 22 \</text>
<text x="626" y="371.0" class="m" xml:space="preserve">  --name &quot;Office SSH&quot;</text>
<rect x="30" y="418" width="360" height="104" rx="8" class="c"/>
<rect x="610" y="418" width="360" height="104" rx="8" class="c"/>
<text x="500" y="466" text-anchor="middle" class="h">Send files</text>
<text x="500" y="488" text-anchor="middle" class="s">a pipe between two shells</text>
<path d="M398 470.0H420M580 470.0H602" stroke="#d0d7de" stroke-width="1.5"/>
<text x="46" y="475.0" class="m" xml:space="preserve">pf-client connect … stdio | tar x</text>
<text x="626" y="455.0" class="m" xml:space="preserve">tar c mydir | \</text>
<text x="626" y="475.0" class="m" xml:space="preserve">  pf-client serve … stdio \</text>
<text x="626" y="495.0" class="m" xml:space="preserve">  --name copy</text>
<rect x="30" y="532" width="360" height="104" rx="8" class="c"/>
<rect x="610" y="532" width="360" height="104" rx="8" class="c"/>
<text x="500" y="580" text-anchor="middle" class="h">Chat</text>
<text x="500" y="602" text-anchor="middle" class="s">two terminals, line by line</text>
<path d="M398 584.0H420M580 584.0H602" stroke="#d0d7de" stroke-width="1.5"/>
<text x="46" y="589.0" class="m" xml:space="preserve">pf-client connect … stdio</text>
<text x="626" y="579.0" class="m" xml:space="preserve">pf-client serve … stdio \</text>
<text x="626" y="599.0" class="m" xml:space="preserve">  --name chat</text>
<text x="500.0" y="654" text-anchor="middle" class="s">“…” stands for the server and the word, e.g. https://relay.example.com/ k3f9-x2mq-7hpa (serve also needs --serve-token)</text>
</svg>
