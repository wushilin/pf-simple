[package]
name = "pfrelay"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the pf-simple relay hub: serve a tunnel or connect through one"
readme = "README.md"
keywords = ["tunnel", "relay", "websocket", "pf-simple"]
categories = ["network-programming", "asynchronous"]
# TODO: license (the repository has no LICENSE file yet), repository

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
thiserror = "2"

[[bin]]
name = "driver"
path = "src/bin/driver.rs"


[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
