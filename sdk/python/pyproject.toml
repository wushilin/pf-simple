[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pfrelay"
version = "0.16.1"
description = "Python SDK for the pf-simple relay hub: serve a tunnel or connect through one"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["tunnel", "relay", "websocket", "quic", "port-forwarding", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/wushilin/pf-simple"
Protocol = "https://github.com/wushilin/pf-simple/blob/main/docs/PROTOCOL.md"

[tool.setuptools]
packages = ["pfrelay"]
