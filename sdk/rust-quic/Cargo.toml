[package]
name = "pfrelay-quic"
version = "0.16.2"
edition = "2021"
description = "Rust SDK for the pf-simple relay hub over QUIC (tunnel protocol 3): serve a tunnel or connect through one"
readme = "README.md"
keywords = ["tunnel", "relay", "quic", "pf-simple"]
categories = ["network-programming", "asynchronous"]
repository = "https://github.com/wushilin/pf-simple"
homepage = "https://github.com/wushilin/pf-simple"
license = "Apache-2.0"

[lib]
name = "pfrelay_quic"

[dependencies]
pfrelay = { path = "../rust", version = "0.16.2" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "time", "sync", "rt", "rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "driver"
path = "src/bin/driver.rs"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
