# pf-client configuration
#
#   pf-client serve -c client.toml       offer the target
#   pf-client connect -c client.toml     reach it on the listen address
#
# -c cannot be combined with other arguments. Unknown keys are errors. One
# file may hold both target and listen; each command uses its own.

# The pf-simple server. https only.
server = "https://relay.example.com/"

# The tunnel's secret, the same on both sides: three groups of four letters
# or digits; case does not matter. "pf-client word" prints a random one.
# serve may leave it out: it then makes one up at every start and prints it,
# which leaves the old one bound on the server, so set it here to keep it.
word = "k3f9-x2mq-7hpa"

# serve: what to forward to. host:port, or a port alone for 127.0.0.1.
# "stdio" or "-" offers pf-client's own stdin/stdout to one connection.
target = "192.168.44.132:22"
# serve: what the tunnel is called in the server's console.
name = "Office SSH"
# serve: your serve token, from the server's admin. Without it,
# $PF_SERVE_TOKEN is used, and without that the registration is anonymous,
# which only a server that allows it accepts. This file then holds a
# secret: chmod 600.
serve_token = "change-me-to-the-token-from-the-console"
# Optional second secret, 8 to 128 characters, or $PF_CLIENT_TOKEN. When
# serve has one, connect needs the same one as well as the word.
# client_token = "something only your users know"

# connect: where to listen. host:port, or a port alone for 127.0.0.1 only;
# "stdio" or "-" carries one connection over stdin/stdout (ssh ProxyCommand).
listen = "2222"

# Trust the server's certificate if this CA issued it: the ca.pem of a
# pf-simple that serves https itself. A relative path is next to this file.
# ca = "ca.pem"

# Skip the check of the server's certificate (like -k).
# insecure = false
